<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Training Plan</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Training Plan">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F4F4F2;--panel:#FFFFFF;--ink:#141414;--muted:#5C5C5C;--line:#DDDBD6;--soft:#ECEAE6;
  --red:#E8590C;--redsoft:#FDEADB;--blue:#B4460A;--bluesoft:#FBE4D2;--good:#2E7D32;--goodsoft:#E3F1E3;
  --warn:#C2410C;--warnsoft:#FCE9DC;--head:#000000;--headink:#FFFFFF;--headmuted:#B8B8B8;--onaccent:#000000;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D0D0D;--panel:#181818;--ink:#F2F2F2;--muted:#A6A6A6;--line:#2F2F2F;--soft:#222222;
  --red:#FF7A2F;--redsoft:#3A2213;--blue:#FF9A5C;--bluesoft:#3A2617;--good:#5CC26A;--goodsoft:#1A3320;
  --warn:#FF8F4D;--warnsoft:#3A2414;--head:#000000;--headink:#FFFFFF;--headmuted:#9A9A9A;--onaccent:#000000;}}
:root[data-theme="dark"]{
  --bg:#0D0D0D;--panel:#181818;--ink:#F2F2F2;--muted:#A6A6A6;--line:#2F2F2F;--soft:#222222;
  --red:#FF7A2F;--redsoft:#3A2213;--blue:#FF9A5C;--bluesoft:#3A2617;--good:#5CC26A;--goodsoft:#1A3320;
  --warn:#FF8F4D;--warnsoft:#3A2414;--head:#000000;--headink:#FFFFFF;--headmuted:#9A9A9A;--onaccent:#000000;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Barlow',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:'Barlow Condensed','Arial Narrow',system-ui,sans-serif;font-weight:700;line-height:1.1;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.num{font-family:'Barlow Condensed','Arial Narrow',sans-serif;font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--head);color:var(--headink);border-bottom:4px solid var(--red)}
.top-in{max-width:880px;margin:0 auto;padding:10px 16px 0}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.brand h1{font-size:26px;letter-spacing:.2px}
.brand h1 span{color:var(--red)}
.sync{font-size:12px;color:var(--headmuted)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:6px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{background:none;border:0;color:var(--headmuted);font:600 15px 'Barlow',sans-serif;padding:8px 12px 10px;cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
nav button[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}
.mainnav button{font-size:16px;padding:8px 14px 10px}
.subnav{margin-top:0;border-top:1px solid rgba(255,255,255,.08)}
.subnav button,.subnav button.stepb{flex:none;min-width:0;min-height:0;background:none;border:0;border-bottom:3px solid transparent;border-radius:0;color:var(--headmuted);font:500 14px 'Barlow',sans-serif;padding:6px 12px 8px}
.subnav button[aria-current="page"]{color:var(--red);border-bottom-color:var(--red)}

main{max-width:880px;margin:0 auto;padding:16px 16px 48px}
.daybar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.daybar h2{font-size:30px}
.daybar .sub{color:var(--muted);font-size:14px;margin-top:2px}
.navbtns{display:flex;gap:6px;flex-shrink:0}

.board{display:grid;grid-template-columns:repeat(3,1fr);background:var(--head);color:var(--headink);border-radius:10px;overflow:hidden;margin-bottom:12px}
.board div{padding:10px 12px 12px;border-right:1px solid rgba(255,255,255,.12)}
.board div:last-child{border-right:0}
.board .lab{font-size:13px;color:var(--headmuted)}
.board .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:40px;line-height:1;font-variant-numeric:tabular-nums}
.board .big.neg{color:var(--red)}
.board .small{font-size:13px;color:var(--headmuted);margin-top:4px}
.tally{background:var(--head);color:var(--headink);border-radius:10px;padding:12px 14px;margin-bottom:12px}
.tally-main{font-family:'Barlow Condensed',sans-serif;font-size:34px;line-height:1.05}
.tally-main b,.tally-sub b{font-weight:700;font-variant-numeric:tabular-nums}
.tally-sub{font-size:15px;color:var(--headmuted);margin:4px 0 8px}
.tally-sub b{color:var(--headink)}
.tally .over{color:var(--red)}
.tally-foot{font-size:12px;color:var(--headmuted);margin-top:6px}
.woline{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:12px}
.mcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}
.mcard h3{margin:2px 0 6px}
.mcard.done{border-left:4px solid #2e8b57}
.mcard.skip{opacity:.7;border-left:4px solid var(--muted)}
details.fold{margin-bottom:10px}
details.fold>summary{cursor:pointer;font-weight:700;font-size:17px;padding:10px 4px;list-style-position:inside}
details.fold>summary .src{font-weight:400;margin-left:6px}
.qwrap{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.qcard{background:var(--panel);color:var(--ink);border-radius:14px;max-width:420px;width:100%;padding:24px 22px;text-align:center;border-top:6px solid var(--red)}
.qm{font-family:'Barlow Condensed',sans-serif;font-size:30px;font-weight:700;color:var(--red);line-height:1.1}
.qms{font-size:15px;color:var(--muted);margin:4px 0 14px}
.qtext{font-size:19px;line-height:1.4;margin:0 0 18px}
.tally-card{margin-bottom:14px}
.tblock{padding:10px 0;border-top:1px solid var(--line)}
.tblock:first-of-type{border-top:0}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:17px}
.tnum{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:22px;font-variant-numeric:tabular-nums}
.tnum.short{color:var(--red)}
.tbar{height:8px;background:var(--soft);border-radius:4px;margin:6px 0;overflow:hidden}
.tbar i{display:block;height:100%;background:#2e8b57}
.tbar i.short{background:var(--red)}
.stepper{display:inline-flex;align-items:center;gap:4px}
.stepper .btn{min-width:38px;padding:6px 10px}
.stepn{min-width:96px;text-align:center;font-weight:600;font-size:14px}
.capsel{display:inline-flex;align-items:center;gap:6px;font-size:14px}
.capsel select{width:auto;min-width:0;padding:6px 8px}
.tline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0}
.bar{height:6px;background:rgba(255,255,255,.15);border-radius:3px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--red)}
.bar i.over{background:#FFFFFF}

.notes{display:grid;gap:8px;margin-bottom:16px}
.note{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--ink);border-radius:6px;padding:10px 12px;font-size:15px}
.note.warn{border-left-color:var(--warn)}
.note.good{border-left-color:var(--good)}
.note .btn{margin-top:8px}

.tl{position:relative;padding-left:30px}
.tl::before{content:"";position:absolute;left:10px;top:6px;bottom:6px;width:3px;background:var(--red);border-radius:2px}
.tl-item{position:relative;margin-bottom:14px}
.tl-item::before{content:"";position:absolute;left:-26px;top:16px;width:13px;height:13px;border-radius:50%;background:var(--panel);border:3px solid var(--red)}
.tl-item.done::before{background:var(--red)}
.tl-item.skip::before{border-color:var(--muted);background:var(--muted)}
.tl-time{font:600 13px 'Barlow',sans-serif;color:var(--muted);margin:0 0 4px 2px}
.tl-mini{background:transparent;border:0;padding:8px 2px;color:var(--muted);font-size:15px}
.tl-mini strong{color:var(--ink)}

.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.card h3{font-size:22px}
.card .kicker{font-size:13px;color:var(--muted)}
.card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:10px;background:var(--soft);color:var(--muted);margin-left:6px;vertical-align:2px}
.tag.red{background:var(--redsoft);color:var(--red)}
.tag.blue{background:var(--bluesoft);color:var(--blue)}
.tag.good{background:var(--goodsoft);color:var(--good)}
.macros{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--muted);margin:6px 0 8px}
.macros b{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
ul.items{margin:6px 0 8px;padding-left:18px}
ul.items li{margin:2px 0}
.prep{font-size:14px;color:var(--muted);margin:6px 0 10px;max-width:70ch}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.btn{font:600 14px 'Barlow',sans-serif;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:7px 12px;cursor:pointer;min-height:36px}
.btn:hover{border-color:var(--muted)}
.btn.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.btn.primary{background:var(--red);border-color:var(--red);color:var(--onaccent)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--blue);padding-left:4px;padding-right:4px}
.btn:disabled{opacity:.55;cursor:default}
.logged{font-size:14px;margin-top:8px;padding:8px 10px;border-radius:6px;background:var(--goodsoft);color:var(--good)}
.logged.skip{background:var(--soft);color:var(--muted)}
.form{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:10px}
.form .wide{grid-column:1/-1}
label.f{display:grid;gap:3px;font-size:13px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:8px 10px;font-size:16px;min-height:38px}
textarea{min-height:70px;resize:vertical}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
details.swap{margin-top:8px}
details.swap summary{cursor:pointer;color:var(--blue);font-size:14px;font-weight:600}

.ex{border-top:1px solid var(--line);padding:10px 0;display:grid;grid-template-columns:minmax(0,1fr) 150px;gap:6px 12px;align-items:start}
.ex:first-of-type{border-top:0}
.ex .nm{font-weight:600}
.ex .rx{font-family:'Barlow Condensed',sans-serif;font-size:18px;color:var(--red);font-weight:600}
.ex .cue{font-size:14px;color:var(--muted)}
.ex .last{font-size:12px;color:var(--muted);margin-top:3px}
.detail p{margin:6px 0;max-width:72ch}
.subhead{font:600 13px 'Barlow',sans-serif;color:var(--muted);margin:12px 0 2px}

.checkin{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.energy{display:flex;gap:4px}
.energy .btn{flex:1;padding:6px 0}

.coach-out{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.coach-out p{margin:6px 0;max-width:72ch}

.week{display:grid;gap:10px}
.wday{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;display:grid;grid-template-columns:110px minmax(0,1fr) auto;gap:12px;align-items:start;text-align:left;width:100%}
.wday.today{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.wday h3{font-size:22px}
.wday .d{font-size:13px;color:var(--muted)}
.wday .m{font-size:14px;color:var(--muted)}
.wday .m strong{color:var(--ink);font-weight:600}
.pill{font-size:12px;font-weight:600;padding:3px 8px;border-radius:10px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--goodsoft);color:var(--good)}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.stat .lab{font-size:13px;color:var(--muted)}
.stat .v{font-family:'Barlow Condensed',sans-serif;font-size:32px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .s{font-size:12px;color:var(--muted)}
.chart{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:12px}
.chart svg{width:100%;height:auto;display:block}
.tbl{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
th:first-child,td:first-child{text-align:left}
th{color:var(--muted);font-weight:600;font-size:13px}
tr:last-child td{border-bottom:0}

.prose{max-width:72ch}
.prose h3{font-size:22px;margin:18px 0 4px}
.prose p{margin:6px 0}
.targets{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:10px 0 16px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grocery h3{font-size:20px;margin:16px 0 6px}
.gitem{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px;cursor:pointer}
.gitem input[type=checkbox],.gitem input[type=radio]{margin-top:4px;width:18px;height:18px;accent-color:var(--red);flex-shrink:0}
.gitem .gbody{flex:1;min-width:0}
.gitem label{cursor:pointer}
.gitem.got label{color:var(--muted);text-decoration:line-through}
.section{margin-top:22px}
.section > h2{font-size:24px;margin-bottom:8px}

@media (max-width:640px){
  .daybar h2{font-size:26px}
  .board .big{font-size:32px}
  .form{grid-template-columns:repeat(2,minmax(0,1fr))}
  .checkin{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ex{grid-template-columns:1fr}
  .stats,.targets{grid-template-columns:repeat(2,minmax(0,1fr))}
  .wday{grid-template-columns:1fr;gap:4px}
  .grid2{grid-template-columns:1fr}
}

a{color:var(--blue)}
.slot{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin-bottom:10px}
.slot .when{font-size:13px;color:var(--muted)}
.slot h3{font-size:21px;margin:2px 0 6px}
.slot select{margin:6px 0}
.src{font-size:13px;color:var(--muted)}
.fixed{border-style:dashed}
.prep-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:15px}
.prep-row:last-child{border-bottom:0}
.slices{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tl-item.act .card{border-left:4px solid var(--blue)}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:640px){.two{grid-template-columns:1fr}.prep-row{grid-template-columns:1fr}}
.stars{display:inline-flex;margin-right:8px}
.star{background:none;border:0;font-size:22px;line-height:1;color:var(--line);cursor:pointer;padding:4px 2px;min-height:34px}
.star.on,.star:hover{color:var(--red)}
.who{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.whob{background:transparent;border:1px solid #444;color:var(--headmuted);border-radius:18px;padding:5px 14px;font:600 14px 'Barlow',sans-serif;cursor:pointer;min-height:34px}
.whob.on{background:var(--red);border-color:var(--red);color:#000}
.whob:disabled{opacity:.5;cursor:default}
main.auth{max-width:460px}
.steps{display:flex;gap:6px;margin-bottom:12px;overflow-x:auto}
.stepb{flex:1;min-width:max-content;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;font:600 15px 'Barlow',sans-serif;color:var(--ink);cursor:pointer;min-height:44px}
.stepb.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.picker{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
table.glance{min-width:640px}
table.glance th,table.glance td{text-align:left;vertical-align:top}
table.glance .src{font-size:12px}
.glance2{display:grid;gap:10px}
.gday{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:120px repeat(3,minmax(0,1fr));gap:10px;align-items:start}
.gday.today{border-color:var(--red);box-shadow:inset 4px 0 0 var(--red)}
.gdh{font-size:17px;padding-top:22px}
.gcell{display:grid;gap:4px;font-size:14px}
.glab{font-size:13px;color:var(--muted);font-weight:600}
.gcell select{font-size:15px;padding:7px 8px}
@media (max-width:760px){.gday{grid-template-columns:1fr}.gdh{padding-top:0}}
.recpanel{border:1px solid var(--line);border-radius:8px;padding:12px 14px;margin:8px 0;background:var(--bg)}
ul.ing{margin:6px 0 10px;padding-left:20px}
ul.ing li{margin:3px 0}
.stepitem{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:16px}
.stepitem input{margin-top:4px;width:20px;height:20px;accent-color:var(--red);flex-shrink:0}
.stepitem.done span{color:var(--muted);text-decoration:line-through}
.pblock{margin:6px 0 4px;display:grid;gap:6px}
.prow{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:14px}
.pstore{width:78px;font-weight:600;color:var(--muted)}
.pin{display:inline-flex;align-items:center;gap:2px}
.pblock input[type=number]{width:84px;min-height:34px;padding:5px 8px;font-size:15px}
.pblock input.pnum{width:66px}
.pblock select{width:auto;min-height:34px;padding:5px 6px;font-size:14px}
.pfor{color:var(--muted)}
.pres{margin-left:auto;text-align:right}
table.psum{min-width:0}
.wstrip{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px}
.wchip{flex:0 0 auto;min-width:108px;display:grid;gap:3px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px;text-align:left;cursor:pointer;color:var(--ink)}
.wchip.on{border-color:var(--red);box-shadow:inset 0 -3px 0 var(--red)}
.wchip .d{font-size:12px;color:var(--muted)}
.wchip strong{font-size:14px;line-height:1.2}
.wctl{display:grid;gap:10px}
.clock{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:46px;line-height:1;font-variant-numeric:tabular-nums}
.restbox{display:inline-flex;align-items:center;justify-content:center;padding:8px 14px;border-radius:8px;background:var(--soft);font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:28px;min-width:110px;min-height:44px;font-variant-numeric:tabular-nums}
.restbox.active{background:var(--red);color:var(--onaccent)}
.exc{margin-bottom:10px}
.exh{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}
.setrow{display:grid;grid-template-columns:64px 1fr 1fr 48px;gap:8px;align-items:center;padding:6px 4px;border-top:1px solid var(--line)}
.setrow.nolift{grid-template-columns:64px 1fr 48px}
.setrow.head{border-top:0;padding-bottom:0}
.setrow input[type=number]{min-height:46px;font-size:19px;text-align:center}
.setrow input[type=checkbox]{width:32px;height:32px;accent-color:var(--red);justify-self:center}
.setrow.done{background:var(--goodsoft);border-radius:6px}

  bubblebfast:{prep:25,cook:35,ing:[

    steps:[
      'Heat the oven to 350°F and grease a 9x13 baking dish.',
      'Poke the sweet potato all over with a fork and microwave it 6 to 8 minutes, flipping it halfway, until a knife slides in easily. Peel it and cut it into small cubes. You need about 6 ounces of cooked potato.',
      'Fry the chopped bacon in a large skillet until crisp, pour off the fat, and move the bacon to a plate. Cook the sausage in the same skillet, breaking it into small crumbles, until no pink remains, then drain it.',
      'Put the sausage, bacon, sweet potato, and quartered biscuit pieces into the baking dish and stir them together.',
      'Whisk the eggs, egg whites, water, salt, pepper, and red pepper flakes in a bowl. Pour it into the dish and stir so it reaches everything.',
      'Bake 25 minutes. Sprinkle the cheddar over the top and bake 10 minutes more, until hot and bubbling. Cut into 6 pieces.']},
  overnight:{prep:20,cook:55,chill:'at least 8 hours',ahead:'Assemble this the night before. It needs at least 8 hours in the fridge, so for a Sunday bake, put it together on Saturday night.',ing:[
    [6,'slice','center-cut bacon','',A.me],

    [1,'tsp','salt','',A.sp],
    [0.5,'tsp','black pepper','',A.sp]],
    steps:[
      'Cook the bacon, let it drain on paper towels, then crumble or chop it.',
      'Grease a 9x13 baking dish. Spread the bread cubes across the bottom and scatter the cheddar over them.',
      'Whisk the eggs, milk, mustard powder, salt, and pepper until smooth. Pour it over the bread and cheese, then top with the bacon.',
      'Cover the dish and refrigerate at least 8 hours, or overnight.',
      'Take the dish out of the fridge 30 minutes before baking and heat the oven to 350°F.',
      'Uncover and bake 50 to 60 minutes, until mostly set and a toothpick in the center comes out clean.',
      'Let it stand 10 minutes, then cut into 8 pieces.']},

  lasagnabake:{prep:15,cook:40,note:'The original includes 8 oz of mushrooms. They are left off the shopping list here; add them back if anyone in the house wants them.',ing:[
    [1.25,'lb','95% lean ground beef','raw',A.me],
    [2,'clove','garlic','minced',A.pr],
    [1,'can','tomato sauce (8 oz)','',A.ca],
    [1,'cup','pasta sauce','',A.ca],
    [1,'','frozen chopped spinach (10 oz)','thawed and squeezed dry',A.fr],
    [1,'tbsp','fresh basil','sliced',A.pr],
    [0.25,'tsp','salt','',A.sp],
    [0.5,'tsp','Italian seasoning','plus a little for the top',A.sp],
    [null,'','crushed red pepper flakes','a pinch',A.sp],
    [null,'','black pepper','a pinch',A.sp],
    [1,'can','refrigerated biscuit dough (7.5 oz)','each biscuit cut into quarters',A.da],
    [0.75,'cup','2% shredded mozzarella cheese','',A.da],
    [0.5,'cup','fat-free ricotta cheese','',A.da]],
    steps:[
      'Heat the oven to 350°F and mist a 9x13 baking dish with cooking spray.',
      'Brown the beef in a large skillet over medium heat, breaking it into pieces, 8 to 10 minutes until cooked through. (If you are using mushrooms, add them after the first couple of minutes.) Stir in the garlic and cook 1 minute more.',
      'Stir in the tomato sauce, pasta sauce, spinach, salt, Italian seasoning, red pepper flakes, black pepper, and biscuit pieces until everything is coated. Spread it evenly in the baking dish and bake 25 minutes.',
      'Sprinkle the mozzarella over the top, drop small spoonfuls of ricotta across the surface, and dust with a little more Italian seasoning. Bake 15 minutes more, until hot and bubbling. Cut into 6 pieces.']},
  turkeychorizo:{prep:25,cook:30,note:'Needs 4 cups of cooked brown rice, so cook the rice first (about 1 1/3 cups dry).',ing:[
    [2,'tsp','canola oil','',A.oi],
    [1,'lb','99% lean ground turkey breast','raw',A.me],
    [6,'oz','pork chorizo','uncooked; casings removed, about 2 links',A.me],
    [1,'','onion','small, chopped',A.pr],
    [1,'','zucchini','medium, shredded',A.pr],
    [1,'can','tomato sauce (8 oz)','',A.ca],
    [16,'oz','red enchilada sauce','two 8 oz pouches, or canned',A.ca],
    [1,'cup','frozen corn','',A.fr],
    [1,'cup','black beans (15 oz)','drained and rinsed',A.ca],
    [4,'cup','long grain brown rice','cooked',A.pa],
    [4,'oz','50% reduced-fat sharp cheddar cheese','shredded, divided',A.da],
    [1,'tbsp','cilantro','chopped, optional',A.pr]],
    steps:[
      'Heat the oven to 350°F.',
      'Heat the oil in a large sauté pan over medium-high heat. Add the turkey and chorizo and cook, breaking them into small chunks. Once the meat starts to brown, add the onion and cook 4 to 5 minutes more, until the meat is cooked through and the onion is soft.',
      'Stir in the zucchini and cook 1 minute, then add the tomato sauce, enchilada sauce, corn, and black beans. Turn the heat to low, cover, and cook 5 minutes, stirring now and then.',
      'Stir in the cooked rice and half the cheddar, then spread it all in a 9x13 baking dish and sprinkle the rest of the cheddar over the top.',
      'Bake 30 minutes. Top with cilantro if you like and serve in 1-cup portions.']},
  quinoabake:{prep:15,cook:35,note:'Needs 3 cups of cooked quinoa, so cook it first (about 1 cup dry).',ing:[
    [1,'tbsp','chili powder','',A.sp],
    [0.25,'tsp','garlic powder','',A.sp],
    [0.25,'tsp','onion powder','',A.sp],
    [0.25,'tsp','crushed red pepper flakes','',A.sp],
    [0.25,'tsp','dried oregano','',A.sp],
    [0.5,'tsp','paprika','',A.sp],
    [1.5,'tsp','ground cumin','',A.sp],
    [1,'tsp','salt','',A.sp],
    [1,'tsp','black pepper','',A.sp],
    [1.25,'lb','95% lean ground beef','raw',A.me],
    [3,'cup','quinoa','cooked',A.pa],
    [1,'cup','frozen corn','thawed',A.fr],
    [1,'can','black beans (15 oz)','drained and rinsed',A.ca],
    [2,'can','red enchilada sauce (10 oz)','',A.ca],
    [0.5,'cup','fat-free sour cream','',A.da],
    [4,'oz','50% reduced-fat sharp cheddar cheese','shredded, divided',A.da]],
    steps:[
      'Heat the oven to 350°F and mist a 9x13 baking dish with cooking spray.',
      'Stir the chili powder, garlic powder, onion powder, pepper flakes, oregano, paprika, cumin, salt, and pepper together to make a taco seasoning.',
      'Brown the beef in a large nonstick skillet over medium heat, breaking it into small pieces. Drain the fat, then stir in the seasoning.',
      'Move the beef to a large bowl and stir in the quinoa, corn, and black beans. Add the enchilada sauce, sour cream, and half the cheddar and mix well.',
      'Spread it in the baking dish, sprinkle the remaining cheddar on top, and bake 35 minutes until bubbling. Serve in 1-cup portions.']},
  louisiana:{prep:15,cook:50,ing:[
    [2,'','eggs','large',A.da],
    [1,'lb','99% lean ground turkey breast','raw',A.me],
    [1,'lb','95% lean ground beef','raw',A.me],
    [2,'tbsp','dried minced onion','',A.sp],
    [1.25,'tsp','celery salt','',A.sp],
    [1.25,'tsp','garlic powder','',A.sp],
    [1.25,'tsp','dried thyme','',A.sp],
    [1.25,'tsp','paprika','',A.sp],
    [0.25,'tsp','black pepper','',A.sp],
    [0.75,'cup','plain breadcrumbs','',A.pa],
    [0.25,'cup','skim milk','',A.da],
    [0.25,'cup','ketchup','',A.oi],
    [0.25,'cup','all-purpose flour','',A.pa],
    [1.5,'tsp','Cajun seasoning','',A.sp],
    [4,'tbsp','light butter','',A.da],
    [2,'cup','reduced-sodium beef broth','',A.ca],
    [1,'tsp','beef bouillon base','such as Better Than Bouillon',A.ca],
    [0.5,'tsp','browning sauce','such as Gravy Master',A.oi]],
    steps:[
      'Heat the oven to 350°F and mist a 2-quart (7x11) baking dish with cooking spray.',
      'Lightly beat the eggs in a large bowl, then add the ground turkey and beef and work them together.',
      'Mix the dried onion, celery salt, garlic powder, thyme, paprika, and pepper in a small bowl and add it to the meat along with the breadcrumbs, milk, and ketchup. Mix by hand until even, then press it evenly into the baking dish.',
      'Bake 45 to 50 minutes, until the center reaches 160°F.',
      'About 10 minutes before the meatloaf is done, make the gravy: stir the flour and Cajun seasoning together. Melt the butter in a saucepan over medium heat, whisk in the seasoned flour a little at a time, and cook 1 to 2 minutes. Slowly whisk in the broth until smooth, then add the bouillon base and browning sauce. Bring to a boil, whisking, until thick. Let it stand 5 minutes.',
      'Cut the meatloaf into 12 slices. A serving is 2 slices with 1/3 cup of gravy.']},
  chxstuffgravy:{prep:20,cook:20,ing:[
    [2,'cup','reduced-sodium chicken broth','divided',A.ca],
    [0.5,'','chicken-flavored stuffing mix (6 oz box)','3 oz, about half a box',A.pa],
    [1,'oz','sweetened dried cranberries','',A.pa],
    [0.5,'tsp','salt','',A.sp],
    [0.25,'tsp','black pepper','',A.sp],
    [0.25,'tsp','dried thyme','',A.sp],
    [0.25,'tsp','garlic powder','',A.sp],
    [1.5,'lb','boneless, skinless chicken breast','raw; 4 breasts, about 6 oz each',A.me],
    [1,'tbsp','olive oil','',A.oi],
    [2,'tbsp','light butter','',A.da],
    [2,'tbsp','all-purpose flour','',A.pa],
    [0.25,'tsp','chicken bouillon base','such as Better Than Bouillon',A.ca],
    [0.25,'tsp','browning sauce','such as Gravy Master',A.oi]],
    steps:[
      'Heat the oven to 400°F and line a baking sheet with parchment paper.',
      'Bring 3/4 cup of the broth to a boil in a small saucepan. Stir in the stuffing mix and cranberries, cover, and take it off the heat. Let it sit 5 minutes, then fluff with a fork.',
      'Slice each chicken breast through the side, almost all the way, so it opens like a book. Mix the salt, pepper, thyme, and garlic powder and sprinkle it over both sides of the closed breasts.',
      'Open each breast, spread about 1/3 cup of stuffing over one half, then fold the top back over and press down.',
      'Heat the oil in a large skillet over medium-high heat (two at a time if they will not all fit). Sear the stuffed breasts about 1 minute per side until golden, move them to the baking sheet, and bake 18 to 22 minutes until cooked through.',
      'While the chicken bakes, melt the butter in the rinsed saucepan over medium-low heat and whisk in the flour to form a paste. Slowly whisk in the remaining 1 1/4 cups broth until smooth, then add the bouillon base and browning sauce. Bring to a boil, then simmer a few minutes until thick.',
      'Serve each stuffed breast with about 1/4 cup of gravy.']},
  buffchili:{prep:10,cook:75,note:'Makes about 10 rounded 1-cup servings.',ing:[
    [2,'lb','boneless, skinless chicken breast','raw; or use ground chicken breast',A.me],
    [1,'tbsp','olive oil','',A.oi],
    [2,'','carrot','large',A.pr],
    [3,'','celery stalks','large',A.pr],
    [1,'','red bell pepper','seeded',A.pr],
    [5,'clove','garlic','',A.pr],
    [5,'tbsp','chili powder','',A.sp],
    [2,'tbsp','ground cumin','',A.sp],
    [1,'tbsp','paprika','',A.sp],
    [0.5,'cup','Buffalo wing sauce','such as Frank\u2019s RedHot',A.oi],
    [2,'can','tomato sauce (15 oz)','',A.ca],
    [1,'can','diced tomatoes (15 oz)','',A.ca],
    [1,'can','black beans (15 oz)','drained and rinsed',A.ca],
    [1,'can','chili beans in sauce (15 oz)','do not drain',A.ca],
    [null,'','salt','to taste',A.sp],
    [null,'','black pepper','to taste',A.sp]],
    steps:[
      'Grind the chicken breasts in a food processor (skip this if using ground chicken). Heat the oil in a large pot over medium-high heat and cook the chicken about 10 minutes, breaking it up, until no pink remains.',
      'While the chicken cooks, rinse the processor and pulse the carrots, celery, bell pepper, and garlic until finely minced. Add them to the pot and cook 5 minutes until softened.',
      'Stir in the chili powder, cumin, paprika, hot sauce, tomato sauce, diced tomatoes, black beans, chili beans, salt, and pepper.',
      'Lower the heat and simmer uncovered for 1 hour, stirring now and then.']},
  pizzalogs:{prep:10,cook:12,ing:[
    [8,'','egg roll wrappers','the large ones, not wonton wrappers',A.pr],
    [8,'tsp','pizza sauce','',A.ca],
    [1,'tsp','Italian seasoning','',A.sp],
    [24,'slice','turkey pepperoni','',A.me],
    [4,'','light mozzarella string cheese sticks','each cut in half crosswise',A.da]],
    steps:[
      'Heat the oven to 425°F and mist a large baking sheet with cooking spray. Set a small dish of water nearby.',
      'Lay a wrapper on the counter with a corner pointing toward you. Spread 1 teaspoon of pizza sauce in a line across the middle, leaving about 1/2 inch clear on each side. Sprinkle on a pinch of Italian seasoning, lay 3 pepperoni slices over the sauce, and set half a cheese stick on top.',
      'Fold the near corner up over the filling and roll once. Fold both side corners in, roll again, then wet the edges of the last corner with a fingertip of water and finish rolling so it seals. Set it seam-down on the baking sheet and repeat.',
      'Mist the tops with cooking spray and bake 10 to 14 minutes, flipping once halfway, until golden brown.']},
  eggrolls:{prep:30,cook:15,ing:[
    [0.25,'cup','onion','diced',A.pr],
    [1,'lb','95% lean ground beef','raw',A.me],
    [1,'tbsp','hamburger seasoning','such as McCormick Grill Mates',A.sp],
    [2,'tbsp','ketchup','',A.oi],
    [2,'tsp','yellow mustard','',A.oi],
    [4,'','light spreadable cheese wedges','such as The Laughing Cow; chopped',A.da],
    [1,'oz','50% reduced-fat sharp cheddar cheese','shredded',A.da],
    [0.25,'cup','dill pickles','diced',A.ca],
    [8,'','grape tomatoes','chopped',A.pr],
    [16,'','egg roll wrappers','the large ones, not wonton wrappers',A.pr]],
    steps:[
      'Mist a large skillet with cooking spray and cook the onion over medium heat a couple of minutes until it starts to turn clear. Add the beef and hamburger seasoning and cook, breaking it up, until browned through. Drain off any liquid.',
      'Move the beef to a microwave-safe bowl and stir in the ketchup, mustard, and chopped cheese wedges. Microwave 1 minute, then stir and mash until the cheese coats the meat. Stir in the cheddar, pickles, and tomatoes.',
      'Heat the oven to 425°F, line a baking sheet with foil, and mist it with cooking spray. Set a small dish of water nearby.',
      'Lay a wrapper with a corner pointing toward you and spread a scant 1/4 cup of filling in a line across the middle, leaving about 1/2 inch clear on each side. Fold the near corner up and roll once, fold in the sides, roll again, then wet the last corner and finish rolling so it seals. Set it seam-down on the sheet and repeat.',
      'Mist the tops with cooking spray and bake 14 to 16 minutes, flipping once, until golden.']},
  sliderbombs:{prep:30,cook:20,note:'The dough is a two-ingredient flour-and-Greek-yogurt dough, so yogurt is baked into the bread rather than eaten on its own. Marinara for dipping is not included in the numbers.',ing:[
    [0.75,'lb','99% lean ground turkey breast','raw',A.me],
    [0.25,'cup','plain breadcrumbs','',A.pa],
    [2,'tbsp','Parmesan cheese','grated',A.da],
    [1.5,'tsp','Italian seasoning','plus a little for the tops',A.sp],
    [0.25,'tsp','garlic powder','',A.sp],
    [1,'tbsp','skim milk','',A.da],
    [1,'','eggs','large',A.da],
    [2,'','light mozzarella string cheese sticks','each cut into 6 chunks',A.da],
    [1,'tbsp','olive oil','',A.oi],
    [1,'cup','self-rising flour','plus a little for dusting',A.pa],
    [1,'cup','plain nonfat Greek yogurt','a thick brand such as Fage 0%',A.da],
    [1,'','egg white','beaten; from one more large egg',A.da]],
    steps:[
      'Mix the ground turkey, breadcrumbs, Parmesan, Italian seasoning, garlic powder, milk, and egg until combined. Divide into 12 equal portions, press a cheese chunk into the center of each, and roll the meat around it into a ball.',
      'Heat the oil in a large skillet over medium-high heat and brown the meatballs on all sides, 5 to 6 minutes. They do not need to be cooked through. Let them cool enough to handle.',
      'Heat the oven to 400°F and line a baking sheet with parchment paper.',
      'Stir the self-rising flour and Greek yogurt together with a fork, then knead 8 to 10 times on a lightly floured surface until slightly tacky but not sticky. Roll it into a rectangle about 10 by 14 inches and cut it into 12 squares.',
      'Set a meatball in the center of each square, fold the corners up over it, pinch the seams closed, and roll gently into a ball. Flour your hands if the dough sticks.',
      'Set them on the baking sheet, brush with the beaten egg white, sprinkle with a little Italian seasoning, and bake 20 to 22 minutes. Serve warm with marinara for dipping.']},
  pizzasliders:{prep:5,cook:15,note:'Pizza-flavored hummus can be hard to find. If the store does not have it, plain hummus with a pinch of Italian seasoning is a reasonable stand-in (my suggestion, not the original recipe\u2019s).',ing:[
    [1,'lb','95% lean ground beef','raw',A.me],
    [2,'oz','pizza-flavored hummus','one single-serve cup, such as Sabra',A.da],
    [null,'','salt','to taste',A.sp],
    [null,'','black pepper','to taste',A.sp],
    [0.5,'cup','2% shredded mozzarella cheese','',A.da],
    [4,'tsp','pizza sauce','',A.ca],
    [8,'slice','turkey pepperoni','',A.me],
    [8,'','whole wheat slider buns','',A.ba]],
    steps:[
      'Mix the beef, hummus, and a sprinkle of salt and pepper by hand until combined, then shape into 8 equal balls.',
      'Mist a nonstick skillet or griddle with cooking spray and heat over medium-high. Add the balls (in two batches if needed) and press each lightly into a patty. Cook 3 to 4 minutes and flip.',
      'Top each patty with 1 tablespoon of mozzarella and cook 2 to 3 minutes more, holding a large lid just above the pan to trap steam and melt the cheese.',
      'Set each burger on a bun and top with 1/2 teaspoon of pizza sauce, a pepperoni slice, and the bun top. Serve right away.']},
  buffwraps:{prep:15,cook:12,ing:[
    [1/3,'cup','plain breadcrumbs','',A.pa],
    [2,'','egg whites','large; or 1/4 cup liquid egg whites',A.da],
    [2,'tbsp','all-purpose flour','',A.pa],
    [0.25,'tsp','black pepper','',A.sp],
    [1,'lb','boneless, skinless chicken breast','raw; 4 cutlets, about 4 oz each',A.me],
    [1/3,'cup','Buffalo wing sauce','plus extra for drizzling if you like',A.oi],
    [6,'','low-carb 8-inch tortillas','high-fiber',A.ba],
    [9,'tbsp','light blue cheese dressing','',A.oi],
    [2,'cup','shredded lettuce','romaine',A.pr],
    [2,'','carrot','medium, shredded',A.pr]],
    steps:[
      'Heat the oven to 375°F and line a baking sheet with parchment paper.',
      'Toast the breadcrumbs in a dry skillet over medium heat a few minutes, stirring every minute, until lightly browned.',
      'Set out three shallow dishes: the lightly beaten egg whites, the toasted crumbs, and the wing sauce.',
      'Shake the chicken with the flour and pepper in a zip-top bag until coated. Dip each piece in egg white, press it into the crumbs on both sides, then dip both sides in the wing sauce. Set it on the baking sheet.',
      'Bake about 12 minutes, until cooked through, then slice into strips.',
      'Warm the tortillas in the microwave so they fold easily. Spread 1 1/2 tablespoons of dressing down the middle of each, divide the chicken among them, add extra wing sauce if you like, and top with lettuce and carrot. Fold in the ends, roll up, and cut in half.']},
  buffsalad:{prep:15,cook:20,note:'The recipe starts from 4 cups of cooked, shredded, chilled chicken; the raw weight below is an estimate for getting there. The dressing uses Greek yogurt, so this one is better suited to Jen unless Karl is fine with it blended into a dressing.',ing:[
    [1.75,'lb','boneless, skinless chicken breast','raw; estimate for about 4 cups cooked and shredded',A.me],
    [0.5,'cup','celery','diced',A.pr],
    [0.5,'cup','carrot','shredded',A.pr],
    [2,'','scallions','sliced',A.pr],
    [7,'tbsp','plain nonfat Greek yogurt','1/3 cup plus 1 tablespoon',A.da],
    [1/3,'cup','light mayonnaise','',A.oi],
    [1/3,'cup','Buffalo wing sauce','such as Frank\u2019s RedHot',A.oi],
    [0.5,'tsp','dried parsley','',A.sp],
    [0.25,'tsp','garlic powder','',A.sp],
    [0.125,'tsp','dried dill weed','',A.sp]],
    steps:[
      'Cook the chicken however is easiest (poaching in simmering water 15 to 20 minutes works well), then shred it and chill it. You want about 4 cups.',
      'Stir the chicken, celery, carrot, and scallions together in a large bowl.',
      'In a small bowl, mix the Greek yogurt, mayonnaise, wing sauce, parsley, garlic powder, and dill until smooth.',
      'Pour the dressing over the chicken mixture and stir until everything is coated. Serve in 3/4-cup portions on bread, in a wrap, or over greens.']},
  sttacochili:{prep:5,cookText:'8 to 10 hours on low, or 4 to 6 hours on high',note:'Makes about 10 servings.',ing:[
    [1,'','onion','small, chopped',A.pr],
    [1,'can','black beans (15 oz)','drained',A.ca],
    [1,'can','red kidney beans (15 oz)','drained',A.ca],
    [1,'can','tomato sauce (8 oz)','',A.ca],
    [10,'oz','frozen corn','',A.fr],
    [2,'can','diced tomatoes with green chilies (10 oz)','such as Rotel',A.ca],
    [1,'can','diced mild green chilies (4 oz)','',A.ca],
    [1,'packet','reduced-sodium taco seasoning (1 oz)','',A.sp],
    [1,'tbsp','ground cumin','',A.sp],
    [1,'tbsp','chili powder','',A.sp],
    [1.5,'lb','boneless, skinless chicken breast','raw; about 3 breasts',A.me],

    steps:[
      'Put the beans, onion, green chilies, corn, tomato sauce, diced tomatoes, cumin, chili powder, and taco seasoning in the slow cooker and stir well.',

      'About 30 minutes before serving, lift out the chicken, shred it, and stir it back in.',

  stipchili:{prep:5,cook:25,note:'Makes about 11 cups. Allow about 15 minutes extra for the pot to come to pressure and release naturally.',ing:[

    [2,'can','diced tomatoes with green chilies (10 oz)','such as Rotel',A.ca],
    [1.5,'lb','boneless, skinless chicken breast','raw; about 3 breasts',A.me],
    [1,'can','diced mild green chilies (4 oz)','',A.ca],
    [0.25,'cup','fresh cilantro','chopped',A.pr],
    [1,'packet','reduced-sodium taco seasoning (1 oz)','divided',A.sp],
    [0.75,'cup','water','divided',A.no]],
    steps:[
      'Set the Instant Pot to sauté, mist the insert with oil spray, and cook the onion 4 to 5 minutes until soft and golden.',
      'Press cancel, then pour in 1/4 cup water and scrape the bottom so nothing sticks (this prevents a burn warning).',
      'Lay in the chicken and season both sides with half the taco seasoning. Add the beans, corn, and green chilies, then the diced tomatoes and tomato sauce on top.',
      'Add the remaining 1/2 cup water and the rest of the seasoning and stir gently without moving the chicken.',
      'Seal and cook on high pressure 25 minutes, then let the pressure release naturally. Shred the chicken, stir it back in, and top with cilantro.']},
  stcarnitas:{prep:15,cookText:'about 8 1/2 hours on low',note:'Makes about 11 half-cup servings.',ing:[
    [2.5,'lb','boneless pork shoulder','blade roast, trimmed',A.me],
    [2,'tsp','kosher salt','',A.sp],
    [null,'','black pepper','to taste',A.sp],
    [6,'clove','garlic','cut into thin slivers',A.pr],
    [1.5,'tsp','ground cumin','',A.sp],
    [0.5,'tsp','sazon seasoning','',A.sp],
    [0.25,'tsp','dry adobo seasoning','such as Goya',A.sp],
    [0.25,'tsp','dried oregano','',A.sp],
    [0.75,'cup','reduced-sodium chicken broth','',A.ca],
    [3,'','chipotle peppers in adobo sauce','2 to 3, to taste; canned',A.ca],
    [2,'','bay leaves','',A.sp]],
    steps:[
      'Season the pork all over with the salt and pepper. Cut small slits all over it with a sharp knife and push the garlic slivers in until they are hidden.',
      'Brown the pork on all sides in a large skillet over high heat, 5 to 7 minutes.',
      'Move it to the slow cooker and season all sides with the cumin, adobo, sazon, and oregano. Pour in the broth and add the bay leaves and chipotles.',
      'Cover and cook on low 8 hours. Shred the pork with two forks and mix it with the juices. Remove the bay leaves and adjust the salt and cumin to taste.',
      'Cook on low 15 to 30 minutes more. For crispy edges, brown portions in a hot skillet misted with cooking spray before serving.']},
  stpork:{prep:5,cookText:'8 to 12 hours on low, plus 1 hour on high',note:'Makes about 8 servings of 3 oz pork with 2 tbsp sauce. Buns are not included in the numbers.',ing:[
    [2.5,'lb','boneless pork loin roast','center cut, trimmed',A.me],

    [1,'tsp','salt','',A.sp],
    [1,'cup','barbecue sauce','plus more for serving',A.oi]],
    steps:[

      'Move the pork to a large dish and pour all the cooking liquid into a cup.',
      'Shred the pork with two forks and return it to the slow cooker with about 3/4 cup of the reserved liquid and the barbecue sauce (about 2 tablespoons of sauce per 3 oz of cooked pork).',
      'Cook on high 1 hour more.']},
  sttacos:{prep:2,cookText:'4 to 6 hours on low',ing:[
    [1.5,'lb','boneless, skinless chicken breast','raw',A.me],

      'Season the chicken with adobo or salt, set it in the slow cooker, and sprinkle with the garlic powder and cumin.',
      'Pour the salsa over the top. Do not add water.',
      'Cover and cook on low 4 to 6 hours, until the chicken shreds easily (start checking at 4 hours).',
      'Pour off the excess liquid, keeping as much of the tomato as you can, then shred the chicken with two forks.',
      'Toss the cabbage with the lime juice, cilantro, and salt for a quick slaw.',
      'Warm the tortillas about 30 seconds per side over a gas flame or in the microwave. Serve 3 per plate topped with chicken, slaw, and avocado, with lime wedges.']},
  bufftaquitos:{prep:45,cook:15,note:'The source lists 4 g of protein per taquito, which looks low for a pound of chicken across 16 taquitos (closer to 7 g would be expected). The app keeps the published number until it can be confirmed.',ing:[
    [1,'tbsp','canola oil','',A.oi],
    [1,'lb','boneless, skinless chicken breast','raw',A.me],
    [1,'cup','Buffalo wing sauce','such as Frank\u2019s RedHot',A.oi],
    [2,'oz','reduced-fat cream cheese','1/3 less fat',A.da],
    [0.25,'cup','light blue cheese dressing','',A.oi],
    [16,'','corn tortillas','6-inch, extra thin',A.ba]],
    steps:[
      'Heat the oven to 400°F. Line a baking sheet with foil and mist with cooking spray.',
      'Heat the oil in a large skillet over medium-high heat and sear the chicken 3 minutes per side. Pour in the Buffalo sauce, let it bubble, then cover, lower the heat to medium-low, and simmer 15 to 20 minutes until cooked through.',
      'Shred each breast with two forks and return it to the sauce. Cook uncovered 3 to 5 minutes more until the sauce thickens and soaks in. Move the chicken to a bowl and stir in the cream cheese and dressing until melted and combined.',
      'Warm half the tortillas between damp paper towels in the microwave 30 to 60 seconds. Spoon 2 tablespoons of filling across the lower third of each, roll it up tightly, and set it seam-down on the baking sheet. Warm and fill the rest the same way.',
      'Bake about 15 minutes, until the tortillas turn golden and crisp.']},
  buffbitesapp:{prep:35,cook:25,note:'EmilyBites now titles this one Cheesy Buffalo Chicken Balls. Makes 24 balls, 4 per serving.',ing:[
    [1,'lb','boneless, skinless chicken breast','raw',A.me],
    [0.5,'cup','Buffalo wing sauce','anywhere from 1/3 to 2/3 cup, to taste',A.oi],
    [0.75,'cup','2% shredded sharp cheddar cheese','',A.da],
    [0.25,'cup','blue cheese','crumbled',A.da],
    [1,'','bunch scallions','chopped',A.pr],
    [4,'oz','reduced-fat cream cheese','1/3 less fat, softened',A.da],
    [2/3,'cup','panko breadcrumbs','whole wheat works well',A.pa],
    [null,'','salt','to taste',A.sp],
    [null,'','black pepper','to taste',A.sp]],
    steps:[
      'Heat the oven to 350°F and mist a baking sheet with cooking spray.',
      'Boil the chicken in a large pot of water, uncovered, 15 to 30 minutes until cooked through. Shred it with two forks.',
      'Mix the shredded chicken with the wing sauce, cheddar, blue cheese, scallions, and cream cheese until well combined. Divide into 24 equal portions and roll each into a ball.',
      'Season the panko with salt and pepper in a shallow dish, roll each ball in it to coat, and set them on the baking sheet.',
      'Mist the tops with cooking spray and bake 20 to 25 minutes, until the coating is lightly browned and crunchy.']},
  stgbbroc:{prep:5,cook:8,note:'Rice is served separately and is not included in the numbers.',ing:[
    [1,'','broccoli','1 large head, cut into florets',A.pr],
    [0.5,'cup','reduced-sodium soy sauce','or gluten-free tamari',A.oi],
    [1,'tbsp','honey','',A.pa],
    [1,'tbsp','cornstarch','',A.pa],
    [0.5,'tbsp','sesame oil','',A.oi],
    [1,'lb','93% lean ground beef','raw',A.me],
    [0.5,'','onion','medium yellow, chopped',A.pr],
    [4,'clove','garlic','minced',A.pr],
    [1,'','fresh ginger','1-inch piece, peeled and grated',A.pr],
    [3,'','scallions','sliced on the bias',A.pr],
    [1,'tbsp','toasted sesame seeds','',A.sp]],
    steps:[
      'Blanch the broccoli florets in boiling water about 1 minute until bright green, then drain.',
      'Whisk the soy sauce, honey, cornstarch, and sesame oil together and set aside.',
      'Brown the beef in a large skillet or wok over medium-high heat, breaking it up as it cooks. Add the onion, garlic, and ginger and cook until the onion softens.',
      'Pour in the sauce, stir, and cook 1 minute until it thickens. Add the broccoli and cook 1 minute more.',
      'Top with the scallions and sesame seeds and serve in 3/4-cup portions over rice.']},
  stsesame:{prep:15,cook:20,note:'Steps are condensed from the source\u2019s method; check the linked page for exact timing. Includes 3 cups of cooked white rice (3/4 cup per serving).',ing:[
    [1.5,'lb','boneless, skinless chicken breast','raw; cut into 1/2-inch cubes',A.me],
    [0.5,'tsp','kosher salt','',A.sp],
    [0.5,'tsp','black pepper','',A.sp],
    [0.25,'tsp','ground ginger','',A.sp],
    [1,'tsp','cornstarch','or arrowroot',A.pa],
    [1.5,'tbsp','toasted sesame oil','divided',A.oi],
    [1,'tbsp','avocado oil','divided; or another neutral oil',A.oi],
    [1/3,'cup','reduced-sodium soy sauce','or gluten-free tamari',A.oi],
    [3,'tbsp','sweetener','monk fruit, coconut sugar, or honey',A.pa],
    [2,'tsp','tomato paste','',A.ca],
    [2.5,'tbsp','seasoned rice vinegar','',A.oi],
    [1,'tbsp','sesame seeds','plus more for garnish',A.sp],
    [1,'tsp','fresh ginger','grated',A.pr],

    [0.25,'cup','water','',A.no],
    [2,'','scallions','sliced',A.pr],
    [3,'cup','white rice','cooked',A.pa]],
    steps:[
      'Toss the cubed chicken with the salt, pepper, ground ginger, cornstarch, and 1 tablespoon of the sesame oil.',
      'Mix the soy sauce, sweetener, tomato paste, rice vinegar, remaining sesame oil, sesame seeds, and fresh ginger in a bowl for the sauce.',
      'Heat half the avocado oil in a large nonstick skillet over medium-high heat and brown half the chicken until crisp and cooked through. Repeat with the rest of the oil and chicken.',
      'Add the garlic and red pepper flakes to the pan for about 30 seconds, then pour in the sauce and water and simmer until it thickens and turns glossy. Toss the chicken back in to coat.',
      'Serve over the rice topped with scallions and extra sesame seeds.']},
  stasian:{prep:15,cook:8,ahead:'Marinate at least 3 hours, ideally overnight. Start this the night before.',ing:[
    [1.5,'lb','boneless, skinless chicken breast cutlets','8 thin cutlets, about 3 oz each',A.me],
    [2,'tbsp','lemon juice','',A.pr],
    [2,'tbsp','toasted sesame seeds','plus more for garnish',A.sp],
    [2,'clove','garlic','minced',A.pr],
    [2,'tsp','fresh ginger','peeled and minced',A.pr],
    [2,'','scallions','minced, plus more for garnish',A.pr],
    [0.25,'cup','low-sodium soy sauce','or tamari',A.oi],
    [0.25,'cup','teriyaki sauce','such as Kikkoman',A.oi],
    [1,'tsp','honey','',A.pa],
    [2,'tsp','sesame oil','',A.oi]],
    steps:[
      'Stir the lemon juice, sesame seeds, garlic, ginger, scallions, soy sauce, teriyaki sauce, honey, and sesame oil together in a small bowl.',
      'Pour it over the chicken, turn the pieces to coat, cover, and refrigerate at least 3 hours or overnight.',
      'Heat a grill or grill pan over medium-low and oil the grates.',
      'Grill the cutlets top side down 2 to 3 minutes until well browned, then flip and cook 2 to 3 minutes more. Watch closely so the marinade does not burn.',
      'Garnish with more sesame seeds and scallions. A serving is 2 cutlets.']},
  stenchiladas:{prep:15,cookText:'3 to 4 hours on high (or 6 to 7 on low), plus 30 minutes',note:'Casserole-style; a serving is 1 cup. Steps are condensed from the source; check the linked page for exact timing. Toppings (avocado, jalape\u00f1o, cilantro, rice) are not included in the numbers.',ing:[
    [1,'tsp','avocado oil','or another neutral oil',A.oi],
    [0.5,'','onion','medium, chopped',A.pr],
    [2,'clove','garlic','finely chopped',A.pr],
    [1,'tsp','ground cumin','',A.sp],
    [1,'tsp','kosher salt','',A.sp],
    [16,'oz','red enchilada sauce','2 cups; jarred or homemade',A.ca],
    [0.25,'cup','sour cream','',A.da],
    [0.25,'cup','water','',A.no],
    [1,'lb','boneless, skinless chicken thighs','raw; or chicken breast',A.me],

    [4,'','corn tortillas','cut into strips',A.ba],
    [4,'oz','reduced-fat shredded Mexican cheese blend','or Monterey Jack or mozzarella',A.da]],
    steps:[
      'Heat the oil in a skillet over medium heat and cook the onion, garlic, cumin, and salt, stirring, until the onion softens and browns.',
      'Move it to the slow cooker and stir in the enchilada sauce, sour cream, and water. Nestle the chicken into the sauce.',
      'Cover and cook on high 3 to 4 hours or low 6 to 7, until the chicken is tender. Shred it right in the pot with two forks.',
      'Stir in the black beans and tortilla strips, sprinkle the cheese over the top, cover, and cook about 30 minutes more until the cheese melts. Serve in 1-cup portions.']},
  poblanobowl:{prep:10,cook:15,note:'Includes 3 cups of cooked brown rice (3/4 cup per bowl). Steps are condensed from the source; check the linked page for exact timing. The sour cream topping is optional.',ing:[
    [1,'tsp','garlic powder','',A.sp],
    [1,'tsp','ground cumin','',A.sp],
    [1,'tsp','kosher salt','plus more to taste',A.sp],
    [0.5,'tsp','chili powder','',A.sp],
    [0.5,'tsp','paprika','',A.sp],
    [0.5,'tsp','dried oregano','',A.sp],
    [1.25,'lb','boneless, skinless chicken breast','raw; cut into 1/2-inch cubes',A.me],
    [2,'tsp','olive oil','',A.oi],
    [1,'','red onion','medium, diced, divided',A.pr],
    [0.25,'cup','fresh cilantro','minced, plus more for garnish',A.pr],
    [1,'','roma tomato','cored and diced',A.pr],
    [1,'','lime','halved',A.pr],
    [1,'','poblano pepper','seeded and diced',A.pr],
    [1,'cup','frozen corn','or fresh',A.fr],
    [0.5,'cup','water','',A.no],
    [3,'cup','brown rice','cooked, heated',A.pa],
    [0.25,'cup','cheddar jack cheese','shredded',A.da],
    [0.25,'cup','light sour cream','optional',A.da]],
    steps:[
      'Stir the garlic powder, cumin, salt, chili powder, paprika, and oregano together for the taco seasoning. Toss the chicken with about half of it.',
      'Make a quick pico de gallo: mix about 1/4 of the diced red onion with the tomato, cilantro, a squeeze of lime, and a pinch of salt.',
      'Heat the oil in a large skillet over medium-high heat and cook the chicken, stirring, until browned and cooked through. Move it to a plate.',
      'Add the remaining onion, the poblano, and the rest of the taco seasoning to the skillet and cook 2 to 3 minutes until soft. Add the water and corn and cook 1 to 2 minutes, then stir the chicken back in and squeeze in the other lime half.',
      'Divide the rice among 4 bowls and top with the chicken mixture, cheese, pico de gallo, and sour cream if using.']},
  rfwlbuffchili:{prep:5,cookText:'4 to 5 hours on high or 6 to 8 on low (or 40 to 60 minutes on the stovetop)',note:'Toppings (sour cream, blue cheese, scallions, extra hot sauce) are not included in the numbers. Use plain cayenne pepper sauce here rather than Buffalo wing sauce.',ing:[
    [1.5,'lb','boneless, skinless chicken breast','raw; or thighs',A.me],
    [3,'can','great northern beans (15 oz)','drained and rinsed; or cannellini',A.ca],
    [1,'tsp','garlic powder','',A.sp],
    [1,'tsp','onion powder','',A.sp],
    [1,'tsp','smoked paprika','',A.sp],
    [0.5,'tsp','kosher salt','',A.sp],
    [1.5,'cup','chicken stock','',A.ca],
    [3,'tbsp','cayenne pepper sauce','2 to 4 tablespoons, such as Frank\u2019s RedHot Original, plus more to taste',A.oi],
    [3,'oz','cream cheese','about 6 tablespoons; added at the end',A.da]],
    steps:[
      'Put the chicken, beans, garlic powder, onion powder, smoked paprika, salt, stock, and hot sauce in a 6-quart slow cooker and stir.',
      'Cover and cook on high 4 to 5 hours or low 6 to 8, until the chicken shreds easily. (Stovetop: bring everything to a boil in a Dutch oven, cover, and simmer 40 to 60 minutes.)',
      'Lift out the chicken and shred or dice it. Pulse the beans with an immersion blender for just 5 to 10 seconds to thicken the chili while keeping most of the beans whole.',
      'Stir a few tablespoons of the hot bean liquid into the cream cheese in a bowl until smooth, then stir it and the chicken back into the pot.',
      'Taste and add more salt or hot sauce a tablespoon at a time. Divide into 6 servings.']},
  mflwhitechili:{prep:10,cook:20,note:'The creamy broth is Greek yogurt thinned with water, stirred in off the heat, so this one leans toward Jen unless Karl is fine with it blended in. The recipe starts from 12 oz of cooked chicken (rotisserie or leftover works); the raw weight below is an estimate.',ing:[
    [2,'tbsp','olive oil','',A.oi],

    [2,'clove','garlic','minced',A.pr],
    [2,'cup','reduced-sodium chicken broth','',A.ca],
    [1,'tsp','ground cumin','',A.sp],
    [1,'tsp','chili powder','',A.sp],
    [1,'can','great northern beans (15 oz)','drained and rinsed',A.ca],
    [1,'can','diced mild green chilies (4 oz)','',A.ca],
    [1,'lb','boneless, skinless chicken breast','raw; estimate for 12 oz cooked, diced or shredded',A.me],
    [1,'cup','plain nonfat Greek yogurt','',A.da],
    [1,'cup','water','',A.no],
    [0.25,'cup','fresh cilantro','chopped',A.pr],
    [null,'','salt','to taste',A.sp],

    steps:[
      'Cook the chicken however is easiest (roasting or a quick pan-sear works well), then dice or shred it.',
      'Heat the oil in a large pot over medium heat and cook the onion 3 to 5 minutes. Add the garlic for 1 minute more.',
      'Stir in the broth, cumin, chili powder, beans, and green chilies. Lower the heat to medium-low and cook about 10 minutes.',
      'Meanwhile, whisk the Greek yogurt with the water. Stir the cooked chicken into the pot and heat 2 to 3 minutes.',
      'Take the pot off the heat, wait 2 to 3 minutes, then stir in the yogurt mixture. Season with salt and pepper and top with cilantro.']},
  waffleegg:{prep:20,cook:15,ing:[
    [6,'slice','center-cut bacon','',A.me],
    [12,'','frozen mini waffles','such as Eggo Homestyle Minis (3 sheets of 4)',A.fr],
    [4,'oz','2% shredded sharp cheddar cheese','about 1 cup, divided',A.da],

    [3,'tbsp','skim milk','',A.da],
    [1,'tsp','dried parsley','',A.sp],
    [0.5,'tsp','black pepper','',A.sp],
    [0.25,'tsp','salt','',A.sp]],
    steps:[
      'Heat the oven to 375°F and mist a 12-cup muffin tin with cooking spray.',
      'Cook the bacon until crisp, drain it on paper towels, and chop it.',
      'Toast the mini waffle sheets and break them into 12 single waffles. Set one in the bottom of each muffin cup.',
      'Sprinkle half the cheddar over the waffles, divide the bacon among the cups, then add the rest of the cheese.',
      'Whisk the eggs, milk, parsley, pepper, and salt and pour it evenly into the cups.',
      'Bake 15 to 18 minutes until golden and set. Cool 5 to 10 minutes before removing. A little maple syrup on the side is optional.']},
  saucybbq:{prep:10,cook:10,ing:[
    [1,'tbsp','all-purpose flour','',A.pa],
    [2,'tsp','paprika','',A.sp],

    steps:[

  teriyakicass:{prep:15,cook:45,note:'Needs 3 cups of cooked brown rice, so cook the rice first (about 1 cup dry).',ing:[
    [0.75,'cup','low-sodium soy sauce','',A.oi],
    [0.5,'cup','water','plus 2 tablespoons for the slurry',A.no],
    [1/3,'cup','brown sugar','packed',A.pa],
    [1,'tbsp','honey','',A.pa],
    [0.75,'tsp','ground ginger','',A.sp],
    [1,'tsp','olive oil','',A.oi],
    [0.5,'tsp','garlic','minced',A.pr],
    [2,'tbsp','cornstarch','',A.pa],
    [1.5,'lb','boneless, skinless chicken breast','raw',A.me],
    [32,'oz','frozen stir-fry vegetables','unsauced',A.fr],
    [1,'cup','pineapple tidbits','canned in juice, drained',A.ca],
    [3,'cup','long grain brown rice','cooked',A.pa]],
    steps:[
      'Heat the oven to 350°F.',
      'Combine the soy sauce, 1/2 cup water, brown sugar, honey, ginger, oil, and garlic in a small saucepan, cover, and bring to a boil over medium heat. Uncover and boil 1 minute.',
      'Stir the cornstarch into the remaining 2 tablespoons of water until smooth, whisk it into the boiling sauce, and cook about 1 minute until it starts to thicken. Take it off the heat.',
      'Lay the chicken flat in a 9x13 dish, pour about 1 cup of sauce over it, and bake 30 to 35 minutes until cooked through. Shred it right in the dish. Cook the frozen vegetables while the chicken bakes.',
      'Add the vegetables, pineapple, rice, and most of the remaining sauce to the dish and stir well. Bake 15 minutes more, then drizzle with the last of the sauce and serve.']},
  bubblepotpie:{prep:20,cook:40,note:'Starts from 12 oz of cooked chicken (rotisserie or leftover works); the raw weight below is an estimate.',ing:[
    [1,'tsp','olive oil','',A.oi],
    [1,'cup','carrot','diced',A.pr],
    [1,'lb','boneless, skinless chicken breast','raw; estimate for 12 oz cooked and shredded',A.me],

    [1,'tsp','dried thyme','',A.sp],

    [1,'can','refrigerated biscuit dough (7.5 oz)','each biscuit cut into quarters',A.da],

    steps:[
      'Cook and shred the chicken if it is not already cooked. Heat the oven to 350°F and mist a 9x13 baking dish with cooking spray.',
      'Heat the oil in a skillet over medium heat and cook the carrots 7 to 8 minutes until somewhat soft.',

  potpiecass:{prep:20,cook:60,note:'The original includes 8 oz of mushrooms. They are left off the shopping list here; add them back if anyone in the house wants them.',ing:[

    [null,'','salt','to taste',A.sp],
    [null,'','black pepper','to taste',A.sp],
    [1,'tsp','soy sauce','',A.oi],
    [1,'tsp','tomato paste','',A.ca],
    [4,'tbsp','light butter','for the sauce',A.da],
    [1/3,'cup','all-purpose flour','for the sauce',A.pa],
    [1,'cup','skim milk','',A.da],
    [2,'tbsp','fresh parsley','minced',A.pr],
    [2,'tsp','fresh thyme','minced',A.pr],
    [1,'tsp','lemon juice','',A.pr],
    [0.75,'cup','frozen peas','',A.fr],
    [1,'cup','all-purpose flour','for the biscuit topping',A.pa],
    [1,'tsp','baking powder','',A.pa],
    [0.5,'tsp','salt','for the topping',A.sp],
    [0.25,'tsp','black pepper','for the topping',A.sp],
    [0.125,'tsp','cayenne pepper','',A.sp],
    [3,'tbsp','light butter','cold, cubed, for the topping',A.da],
    [0.25,'cup','Parmesan cheese','grated, the shaker kind',A.da],

    steps:[
      'Heat the oven to 450°F. Put the chicken in a large pot, pour the broth over, cover, and simmer over medium-high 10 to 12 minutes until cooked through. Shred the chicken into a large bowl and pour the broth into a cup to save.',
      'While the chicken cooks, make the topping: mix the flour, baking powder, salt, pepper, and cayenne, then work in the cold butter with your fingers until crumbly. Stir in the Parmesan and then the half and half until it forms a shaggy dough. Drop 1/2- to 1-inch pieces onto a lined baking sheet and bake 10 to 13 minutes until light golden. Leave the oven on.',
      'In the empty pot, heat 2 teaspoons of oil over medium heat, add the onion, carrots, celery, salt, and pepper, cover, and cook on medium-low about 5 minutes until just tender. Add them to the chicken.',
      'Heat the remaining 2 teaspoons of oil in the pot (if using mushrooms, cook them covered about 5 minutes now). Stir in the soy sauce and tomato paste for a minute, then add everything in the pot to the chicken bowl.',
      'Melt the 4 tablespoons of butter in the pot over medium heat, whisk in the 1/3 cup flour, then slowly whisk in the saved broth and the milk until smooth. Simmer, stirring, until thickened. Off the heat, stir in the parsley, thyme, lemon juice, peas, and the chicken and vegetables.',
      'Spread it in a 9x13 baking dish, scatter the biscuit pieces over the top, and bake 15 minutes at 450°F until bubbling. Cut into 8 portions.']},
  chxbrocrice:{prep:20,cook:30,note:'Needs 4 cups of cooked brown rice and 2 cups of cooked chicken; the raw amounts below are estimates (about 1 1/3 cups dry rice).',ing:[

    steps:[

      'Combine the rice, chicken, and broccoli in the baking dish, pour the cheese sauce over, and stir until coated. Spread it evenly.',
      'Toast the breadcrumbs in a dry skillet over medium heat a few minutes until golden, sprinkle them over the top, and bake 30 to 35 minutes until hot and bubbling. Cut into 8 portions.']},
  spicysausage:{prep:5,cook:35,ing:[
    [1,'tsp','olive oil','',A.oi],

      'Heat the oil in a large Dutch oven or oven-safe sauté pan over medium heat. Cook the onion and sausage 5 to 6 minutes until browned, then add the garlic for 30 seconds.',
      'Stir in the broth, Rotel, half and half, salt, and pepper, then the uncooked pasta, pushing it under the liquid. Cover, bring to a boil, then simmer on medium-low about 15 minutes until the pasta is done.',
      'Turn the broiler on with a rack in the top third of the oven. Off the heat, stir in half the cheese. (If your pan is not oven-safe, move everything to a 7x11 or 9x13 baking dish.)',
      'Top with the rest of the cheese and the scallions and broil a few minutes, watching closely, until melted and starting to brown.']},
  sausagetort:{prep:5,cook:30,note:'The original includes 8 oz of mushrooms. They are left off the shopping list here; add them back if anyone in the house wants them.',ing:[

      'Turn off the burner, sprinkle the mozzarella over the top, cover, and leave it on the warm burner about 2 minutes until melted. Serve in generous 1-cup portions.']},
  pumpkintort:{prep:5,cook:25,ing:[

  chxparmcrispy:{prep:20,cook:20,ing:[
    [4,'','boneless, skinless chicken breast cutlets','5 oz each, 20 oz total',A.me],

  honeyturmeric:{prep:15,cook:10,ing:[
    [0.25,'cup','water','',A.no],

    [0.75,'tsp','black pepper','',A.sp],

      'In a small bowl, stir together the water, honey, pepper, and 1/2 teaspoon of the salt.',

  eggcups:{prep:10,cook:20,ing:[

      'Heat the oven to 350°F and mist a 12-cup muffin tin with cooking spray. Press a slice of ham into each cup, shaping the edges up the sides to form a cup. Chop the remaining ham into small pieces and set aside.',

  hbbake:{prep:30,cook:60,ing:[

      'Whisk the eggs, milk, and mustard together. Stir in 2 ounces of the mozzarella, the Parmesan, the hash browns, salt, and pepper.',

      'Bake covered 45 minutes, then uncover and bake 15 minutes more until set through. Let cool 5 to 10 minutes before cutting into 8 pieces.']},
  stburritos:{prep:20,cook:10,ahead:'Wrap cooled burritos in foil and freeze up to 3 months.',ing:[
    [6,'slice','center-cut bacon','',A.me],

  chilimac:{prep:10,cook:30,ing:[

  spagpie:{prep:30,cook:20,ing:[

  cincy:{prep:10,cook:60,ing:[

  potpasta:{prep:5,cook:55,note:'Poaching the chicken first adds about 20 minutes; using 1 lb of already-cooked, shredded chicken shortens this.',ing:[
    [1.5,'lb','boneless, skinless chicken breast','raw',A.me],

    steps:[

      'Whisk in the milk, then the water, bouillon base, and poultry seasoning, and bring to a simmer, whisking until slightly thickened.',

  cheeseburgerpasta:{prep:5,cook:35,ing:[
    [1,'lb','99% lean ground turkey breast','raw',A.me],

  chxparmpasta:{prep:20,cook:45,ing:[

  salsachicken:{prep:5,cook:240,cookText:'4 hours on low',ing:[
    [1.5,'lb','boneless, skinless chicken thighs','trimmed of fat, or use chicken breasts',A.me],

  tatertot:{prep:25,cook:60,ing:[

  hautburrito:{prep:15,cook:15,ahead:'Cool the egg mixture completely before wrapping. Refrigerate up to 4 days or freeze up to 4 months.',ing:[

  cajunpasta:{prep:15,cook:25,ing:[

  bbqmac:{prep:5,cook:45,ing:[

  tacocasserole:{prep:20,cook:20,note:'Let rest 8 to 10 minutes before topping and slicing.',ing:[

    s+='<text x="'+P.l+'" y="'+(H-6)+'">'+fmtShort(dates[0])+'</text><text x="'+(W-P.r)+'" y="'+(H-6)+'" text-anchor="end">'+fmtShort(last)+'</text></g>';
    if(p.goal1>=lo&&p.goal1<=hi)s+='<line x1="'+P.l+'" x2="'+(W-P.r)+'" y1="'+Y(p.goal1)+'" y2="'+Y(p.goal1)+'" stroke="var(--good)" stroke-dasharray="5 4"/>';
    s+=dates.map(d=>'<circle cx="'+X(d).toFixed(1)+'" cy="'+Y(+S.days[d].weight).toFixed(1)+'" r="3" fill="var(--muted)" opacity=".55"/>').join('')+'<polyline fill="none" stroke="var(--red)" stroke-width="3" stroke-linejoin="round" points="'+dates.map((d,i)=>X(d).toFixed(1)+','+Y(as[i]).toFixed(1)).join(' ')+'"/></svg>';
    h+='<div class="chart">'+s+'<div class="hint">Dots are daily weigh-ins. The red line is your 7-day average, which is the number to judge progress by.</div></div>';
  }else h+='<div class="note">Log your morning weight in the daily check-in. The chart appears after two weigh-ins.</div>';
  const cw=weekNum(td);let adher=0;for(let i=1;i<=14;i++)if(dayEaten(addD(td,-i)).meals>=3)adher++;
  h+='<div class="section"><h2>Calorie target check</h2><div class="card"><p style="margin-top:0">Current adjustment: '+(p.kcalOffset?(p.kcalOffset>0?'+':'')+p.kcalOffset+' kcal per day':'none')+'. Today\'s base target is '+fmtN(targetsFor(td).kcal)+' kcal.</p>';
  if(rate!=null&&cw>=4&&rate<0.5&&adher>=10)h+='<div class="note warn">You are logging consistently but the average has moved less than half a pound per week for two weeks. Lower the daily target by 100 calories.<br><button class="btn primary" data-action="offset" data-v="-100">Lower by 100 kcal</button></div>';
  else if(rate!=null&&cw>=3&&rate>3)h+='<div class="note good">You are losing more than 3 lb per week after the first two weeks. That pace risks muscle loss and fatigue. Raise the daily target by 150 calories.<br><button class="btn primary" data-action="offset" data-v="150">Raise by 150 kcal</button></div>';
  else h+='<p class="hint">No change is recommended right now. The first week or two drops faster from water weight; judge the pace from week 3 on. A healthy pace for you is 1 to 2 1/2 lb per week.</p>';
  if(p.kcalOffset)h+='<button class="btn ghost" data-action="offset" data-v="reset">Reset the adjustment</button>';
  h+='</div></div><div class="section"><h2>Week by week</h2><div class="tbl"><table><thead><tr><th>Week</th><th>Avg weight</th><th>Avg calories</th><th>Avg protein</th><th>Workouts</th><th>Avg steps</th></tr></thead><tbody>';
  for(let w=Math.max(1,cw-11);w<=cw;w++){const st=addD(p.startDate,(w-1)*7);let kc=[],pr=[],wo=0,stp=[],wt=[];
    for(let i=0;i<7;i++){const d=addD(st,i),x=S.days[d]||{},e=dayEaten(d);if(e.meals>=3){kc.push(e.kcal);pr.push(e.p);}if((sessDone(x.workout)&&workoutKey(d,'home')!=='REC')||sessDone(x.gym))wo++;if(x.steps)stp.push(+x.steps);if(x.weight)wt.push(+x.weight);}
    h+='<tr><td>Week '+w+' <span class="kicker">'+fmtShort(st)+'</span></td><td>'+(wt.length?avg(wt).toFixed(1):'')+'</td><td>'+(kc.length?fmtN(avg(kc)):'')+'</td><td>'+(pr.length?fmtN(avg(pr))+' g':'')+'</td><td>'+wo+(S.profile.training==='own'?' done':' of 6')+'</td><td>'+(stp.length?fmtN(avg(stp)):'')+'</td></tr>';}
  return h+'</tbody></table></div><p class="hint">Calorie and protein averages include only days with at least 3 meals logged.</p></div>';
}

const SALAD_TOP=[
  {name:'Grilled chicken, 4 oz',kcal:185,p:35,c:0,f:4},{name:'Hard-boiled egg',kcal:70,p:6,c:0,f:5},{name:'Deli turkey, 2 oz',kcal:60,p:10,c:2,f:1},

  {name:'Tomatoes, cucumber, carrots, onion',kcal:40,p:1,c:9,f:0}];
const SALAD_DRESS=[{name:'No dressing',kcal:0,p:0,c:0,f:0},{name:'Light Italian',kcal:30,p:0,c:3,f:2},{name:'Light ranch',kcal:70,p:0,c:3,f:6},{name:'Italian',kcal:80,p:0,c:3,f:7},{name:'Balsamic vinaigrette',kcal:90,p:0,c:5,f:8},{name:'Honey mustard',kcal:120,p:0,c:8,f:10},{name:'Ranch',kcal:130,p:0,c:2,f:13},{name:'Caesar',kcal:150,p:1,c:1,f:16},{name:'Blue cheese',kcal:150,p:1,c:1,f:16}];
function saladTotals(){const t=Object.assign({},SALAD_BASE);SALAD_TOP.forEach((x,i)=>{if(S.salad.t[i])for(const k of ['kcal','p','c','f'])t[k]+=x[k];});const d=SALAD_DRESS[S.salad.d];for(const k of ['kcal','p','c','f'])t[k]+=d[k];return t;}
function saladText(date){const t=saladTotals(),rem=adjustedTarget(date).kcal-dayEaten(date).kcal,d=SALAD_DRESS[S.salad.d];
  let x='This salad is about <strong>'+fmtN(t.kcal)+' calories and '+fmtN(t.p)+' g protein</strong>. ';
  x+=rem>0?'That is '+Math.round(t.kcal/rem*100)+' percent of the '+fmtN(rem)+' calories you have left today.':'You are already at your target today, so this would come out of the weekly budget.';
  if(d.kcal>=120)x+=' The dressing alone is '+d.kcal+' calories; light Italian would save '+(d.kcal-30)+'.';
  if(t.p<20)x+=' Add grilled chicken or egg if this is a meal, so it keeps you full.';
  return x;}
function addSalad(date){const t=saladTotals(),parts=SALAD_TOP.filter((x,i)=>S.salad.t[i]).map(x=>x.name.split(',')[0].toLowerCase());const l=day(date);l.extras=l.extras||[];
  l.extras.push({name:'Salad'+(parts.length?' with '+parts.join(', '):'')+', '+SALAD_DRESS[S.salad.d].name.toLowerCase(),kcal:t.kcal,p:t.p,c:t.c,f:t.f});saveDay(date);render();}

function buildReport(n){
  const td=S.date>todayStr()?todayStr():S.date,p=S.profile,t=targetsFor(td);let from=addD(td,-(n-1));if(from<p.startDate)from=p.startDate<=td?p.startDate:td;
  const L=[];const ln=x=>L.push(x);
  ln(p.name+'\'s Training Plan update, generated '+new Date().toLocaleString());
  ln('Person: '+p.name+'. Sex '+p.sex+', age '+p.age+', height '+p.heightIn+' in. Main training: '+(p.training==='own'?'own gym program':'home plan')+'; home sessions and gym workouts are logged separately and can both happen on one day. Pace goal '+p.pace+' lb per week, activity factor '+p.activity+'.');
  for(const wk of [monday(td),addD(monday(td),7)]){const sp=snackPicks(wk);if(wk!==monday(td)&&!sp.length&&!(S.house.lunch&&S.house.lunch[wk]))continue;const lp=[0,1,2,3,4].map(d=>{const v=lunchPick(p.name,wk,d);return v?DAYN[d].slice(0,3)+' '+(v==='__pizza'?'pizza':v==='__none'?'eating out':R[v].name):'';}).filter(Boolean);ln('Snacks picked for the week of '+wk+': '+(sp.length?sp.map(k=>SNACK_BY_ID[k].name).join(', '):'none yet')+'. Plan snacks only from these.'+(lp.length?' Own weekday lunches: '+lp.join('; ')+'.':''));}

const ZXING_URL='https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
let SCAN=null;
function loadScript(u){return new Promise((res,rej)=>{if(window.ZXing)return res();const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>rej(new Error('Could not load the scanner'));document.head.appendChild(s);});}
function scanMsg(t){if(S.fp)S.fp.scanMsg=t;const m=document.getElementById('fpScanMsg');if(m)m.textContent=t;}
async function startScan(){stopScan();const v=document.getElementById('fpVid');if(!v||!S.fp)return;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){scanMsg('This browser cannot open the camera here. Type the barcode number below instead.');return;}
  const run={on:true};SCAN=run;S.scanning=true;const cons={video:{facingMode:{ideal:'environment'},width:{ideal:1280}},audio:false};
  try{
    if('BarcodeDetector' in window){let fm=['ean_13','ean_8','upc_a','upc_e'];try{const sup=await window.BarcodeDetector.getSupportedFormats();fm=fm.filter(f=>sup.includes(f));}catch(e){}
      if(fm.length){const st=await navigator.mediaDevices.getUserMedia(cons);run.stream=st;if(!run.on){st.getTracks().forEach(t=>t.stop());return;}v.srcObject=st;try{await v.play();}catch(e){}
        const det=new window.BarcodeDetector({formats:fm});scanMsg('Point the camera at the barcode and hold steady.');
        const tick=async()=>{if(!run.on)return;try{if(v.readyState>=2){const r=await det.detect(v);if(r&&r.length&&run.on){gotCode(r[0].rawValue);return;}}}catch(e){}run.t=setTimeout(tick,180);};tick();return;}}
    scanMsg('Loading the scanner...');await loadScript(ZXING_URL);if(!run.on)return;
    const Z=window.ZXing,hints=new Map();hints.set(Z.DecodeHintType.POSSIBLE_FORMATS,[Z.BarcodeFormat.EAN_13,Z.BarcodeFormat.EAN_8,Z.BarcodeFormat.UPC_A,Z.BarcodeFormat.UPC_E]);
    const rd=new Z.BrowserMultiFormatReader(hints,200);run.reader=rd;
    await rd.decodeFromConstraints(cons,v,res=>{if(res&&run.on)gotCode(res.getText());});
    if(run.on)scanMsg('Point the camera at the barcode and hold steady.');
  }catch(e){const blocked=e&&(e.name==='NotAllowedError'||e.name==='SecurityError');stopScan();scanMsg(blocked?'Camera access is blocked. Allow the camera for this site in your browser settings, or type the barcode number below.':'The camera could not start. Type the barcode number below instead.');}}
function stopScan(){const r=SCAN;SCAN=null;const was=S.scanning;S.scanning=false;if(r){r.on=false;clearTimeout(r.t);try{if(r.reader)r.reader.reset();}catch(e){}if(r.stream)r.stream.getTracks().forEach(t=>t.stop());}
  const v=document.getElementById('fpVid');if(v&&v.srcObject){try{v.srcObject.getTracks().forEach(t=>t.stop());}catch(e){}v.srcObject=null;}
  if(was&&S.dirty){S.dirty=false;setTimeout(render,50);}}
function gotCode(raw){stopScan();try{if(navigator.vibrate)navigator.vibrate(60);}catch(e){}lookupCode(raw);}
function normCode(x){let s=String(x||'').replace(/\D/g,'');if(s.length===12)s='0'+s;return s.length>=8&&s.length<=14?s:'';}
async function offLookup(code){const tries=[code];if(code.length===13&&code[0]==='0')tries.push(code.slice(1));let reached=false;
  for(const c of tries){let j;try{const r=await fetch('https://world.openfoodfacts.org/api/v2/product/'+c+'.json?fields=product_name,product_name_en,brands,serving_size,serving_quantity,nutriments',{credentials:'omit'});reached=true;if(!r.ok)continue;j=await r.json();}catch(e){continue;}
    if(!j||j.status!==1||!j.product)continue;const P=j.product,N=P.nutriments||{},sq=n0(P.serving_quantity),has=v=>v!=null&&v!=='';
    const per=k=>has(N[k+'_serving'])?n0(N[k+'_serving']):(has(N[k+'_100g'])&&sq?n0(N[k+'_100g'])*sq/100:null);
    let k=per('energy-kcal'),s=P.serving_size||'';if(k==null){const kj=per('energy');if(kj!=null)k=kj/4.184;}
    let p=per('proteins'),cc=per('carbohydrates'),f=per('fat');
